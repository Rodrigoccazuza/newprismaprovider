name: Optimize service photography
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize-service-photos.py'
      - '.github/workflows/optimize-service-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python scripts/optimize-service-photos.py
      - name: Commit optimized WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/photos/optimized/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize How we can help photography"
            git push
          fi
