name: Prepare transparent card icons
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-why-icons.py'
      - 'public/images/why/*.webp'
      - '.github/workflows/prepare-why-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - run: python scripts/prepare-why-icons.py
      - name: Commit transparent PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/why/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate transparent PNG icons for Why Prisma cards"
            git push
          fi
